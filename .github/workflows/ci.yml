name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Manifest sanity
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.name) { throw 'package.json missing name' }
          if (-not $pkg.dsh.bundle.patch) { throw 'package.json missing dsh.bundle.patch' }
          if (-not (Test-Path $pkg.dsh.bundle.patch)) { throw "patch file not found: $($pkg.dsh.bundle.patch)" }
          if (-not (Test-Path 'index.js')) { throw 'index.js missing' }
          if (-not (Test-Path 'client.js')) { throw 'client.js missing' }
          Write-Host "manifest ok: $($pkg.name)@$($pkg.version)"
